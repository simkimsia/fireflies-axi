[project]
name = "fireflies-axi"
version = "0.1.0"
description = "Pull meeting transcripts from Fireflies.ai: a plain CLI over the Fireflies GraphQL API"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.scripts]
fireflies = "fireflies_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fireflies_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
